name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:functional
      - name: Bundled plugin is up to date
        run: npm run build:plugin && git diff --exit-code plugin/dist

  e2e:
    runs-on: ubuntu-latest
    needs: unit-functional
    strategy:
      fail-fast: false
      matrix:
        runtime: [native, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Cache Gitea and gitleaks downloads
        if: matrix.runtime == 'native'
        uses: actions/cache@v4
        with:
          path: .e2e-cache/bin
          key: slipway-bin-${{ runner.os }}-${{ hashFiles('src/runtime/downloads.ts') }}
      - name: Pull images
        if: matrix.runtime == 'docker'
        run: docker pull gitea/gitea:28.3.0-rootless && docker pull zricethezav/gitleaks:v8.30.1
      - run: npm run test:e2e
        env:
          CI: "1"
          SLIPWAY_E2E_RUNTIME: ${{ matrix.runtime }}
      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.runtime }}
          path: |
            playwright-report/
            test-results/
            .e2e-tmp/home/gitea/log/
          retention-days: 7
